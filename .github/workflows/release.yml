name: Release
# Every version tag ships the forever edition as a release artifact —
# the single-file build is a feature, not legacy (README, MASTER-PROMPT §2).
on:
  push:
    # dotted version tags only — v2.0.0 releases, v1-classic (the frozen
    # baseline tag) must never re-release
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    # The `secrets` context cannot be read from a step's `if` — GitHub rejects
    # the whole workflow file for it. Hoisting the token into the job's env
    # makes the same test legal (`env.NPM_TOKEN != ''`).
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable # before setup-node so its pnpm cache probe finds pnpm
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the forever edition
        run: node build.mjs
      - name: Checksum
        run: sha256sum dist/DocForge.html > dist/DocForge.html.sha256
      - name: Create release with the single-file build attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/DocForge.html dist/DocForge.html.sha256 \
            --title "DocForge $GITHUB_REF_NAME" \
            --generate-notes

      # The two library packages go to npm from the same tag — but only once
      # the repository owner has added an NPM_TOKEN secret. Without it these
      # steps skip, so a tag still cuts a GitHub release either way.
      - name: Build the npm packages
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          pnpm --filter "@docforge/engine" run build
          pnpm --filter "@docforge/mathml-omml" run build
          node qa/dist-consume.mjs
      - name: Publish @docforge/engine and @docforge/mathml-omml
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          # --no-git-checks: the tag is the release, and the working tree
          # carries the freshly built dist/ these packages publish.
          pnpm --filter "@docforge/engine" publish --no-git-checks --access public
          pnpm --filter "@docforge/mathml-omml" publish --no-git-checks --access public
