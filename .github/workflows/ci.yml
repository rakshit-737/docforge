name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable # before setup-node so its pnpm cache probe finds pnpm
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec biome check .
      - name: Typecheck
        run: pnpm -r run typecheck
      - name: Unit tests (with the engine byte-parity suite armed)
        run: pnpm test
        env:
          RUN_PARITY: "1"
      - name: Build single-file edition
        run: node build.mjs
      # Phase-5 gate: the forever edition, opened from file:// in a browser
      # whose every non-file request is aborted. A single network attempt
      # fails the run — "works offline" must not lean on anyone's cache.
      - name: Offline gate (file://, network cut)
        run: node qa/offline-gate.mjs
        env:
          PW_CHROMIUM: /usr/bin/google-chrome
      # Phase-5 gate: the core is genuinely headless — every torture document
      # in the golden corpus converts through the CLI with no browser.
      - name: CLI builds the golden corpus
        run: |
          pnpm --filter "@docforge/cli" run build
          node qa/cli-corpus.mjs
      # Phase-5 gate: the two npm packages, imported from plain Node ESM —
      # the workspace eats their TypeScript source, so only this would catch
      # a dist that bundlers forgive and Node rejects.
      - name: The npm builds import under plain Node
        run: |
          pnpm --filter "@docforge/engine" run build
          pnpm --filter "@docforge/mathml-omml" run build
          node qa/dist-consume.mjs
      - name: Build web studio
        run: pnpm --filter "@docforge/web" run build

  web-regression:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web studio for production-browser checks
        run: pnpm --filter "@docforge/web" run build
      - name: Web studio Playwright, axe, security, and offline regression
        run: pnpm web:e2e
        env:
          PW_CHROMIUM: /usr/bin/google-chrome
      - name: Web preview/PDF/DOCX parity gate
        run: pnpm web:parity
        env:
          PW_CHROMIUM: /usr/bin/google-chrome
      - name: Upload web regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-regression-evidence
          path: |
            qa/out/golden/web-parity-report.json
            qa/out/golden/web-parity-diff/
            qa/out/golden/web-parity/web/manifest.json
            qa/out/lighthouse/
          if-no-files-found: ignore
          retention-days: 14
